version: 2
updates:
  # フロントエンド (ルート)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # minor / patch をまとめて PR 数を抑制
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # メジャー更新は破壊的で CI が落ち、通知メールを量産するため自動 PR を止める
    # (必要なメジャー更新は手動で対応。セキュリティ更新は ignore の影響を受けない)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # インフラ (CDK)
  - package-ecosystem: "npm"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # メジャーも含め 1 本の PR にまとめて通知を減らす
      actions-all:
        update-types:
          - "major"
          - "minor"
          - "patch"
