name: Security baseline

on:
  pull_request:
  push:
    branches: [main, development]
  schedule:
    # Monday 03:37 JST. The non-round minute avoids peak scheduler load.
    - cron: '37 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Production dependency audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: app
            directory: .
            lockfile: package-lock.json
          - package: infra
            directory: infra
            lockfile: infra/package-lock.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}
      - name: Audit production dependencies
        run: |
          if node -e "const p=require('./package.json'); process.exit(Object.keys(p.dependencies ?? {}).length ? 0 : 1)"; then
            npm audit --audit-level=high --omit=dev
          else
            echo "No production dependencies to audit."
          fi
        working-directory: ${{ matrix.directory }}
