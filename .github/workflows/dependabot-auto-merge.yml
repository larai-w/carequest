name: Dependabot auto-merge
# patch/minor の依存更新は CI 緑で自動マージ（main まで）。major は手動レビュー。
# 前提: リポジトリ設定 "Allow auto-merge" 有効（allow_auto_merge=true）。
#       ブランチ保護の必須チェックがあれば、それが緑になってからマージされる。
#
# ⚠️ **このマージは Deploy production を起動しない。**
#
# GITHUB_TOKEN で行われた push は、他のワークフローを起動しない（GitHub の
# ループ防止仕様）。auto-merge の実体は GITHUB_TOKEN による push なので、
# `Deploy production` の `on: push: branches: [main]` は反応しない。
#
# 2026-08-17 に実際に起きた。PR #85 が 14:17Z に auto-merge されたが Deploy は
# 走らず、翌 23:35Z の手動 dispatch まで **33.3時間** main と本番がずれた。
# DORA の Lead p95 が 24h ガードレールを超えた唯一の要因。
#
# **PAT で解決しない。** 長期キーを増やす方向は取らない（OIDC へ移行した経緯と
# 逆行する）。代わりに `deploy-prod.yml` に定期実行を入れ、デプロイ済みの
# コミットと main を突き合わせて、ずれていたときだけ流すようにした（最大6時間）。
#
# ここを PAT に変えたくなったら、まず deploy-prod.yml の定期実行を見ること。
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Enable auto-merge for patch/minor
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
