name: Dependabot auto-merge
# Patch and minor dependency updates are merged automatically once CI is green
# (all the way to main). Major updates are reviewed by hand.
# Requires: repository setting "Allow auto-merge" (allow_auto_merge=true).
#           With branch protection, the merge waits for the required checks.
#
# This merge does NOT start Deploy production.
#
# A push made with GITHUB_TOKEN does not start other workflows (GitHub's
# loop-prevention rule). Auto-merge is a GITHUB_TOKEN push, so
# `Deploy production` and its `on: push: branches: [main]` never fire.
#
# This happened on 2026-08-17: PR #85 was auto-merged at 14:17Z, no deploy ran,
# and main and production stayed out of step for 33.3 hours until a manual
# dispatch at 23:35Z the next day. It was the only reason DORA lead time p95
# went over the 24h guardrail.
#
# A PAT does not fix this. Adding more long-lived keys runs against the move to
# OIDC. Instead, deploy-prod.yml runs on a schedule, compares the deployed
# commit against main, and deploys only when they differ (at most 6 hours late).
#
# If you are ever tempted to switch this to a PAT, look at the scheduled run in
# deploy-prod.yml first.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Enable auto-merge for patch/minor
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
