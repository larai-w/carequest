name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # A push trigger alone misses deploys. Dependabot auto-merge pushes with
  # GITHUB_TOKEN, and such a push does not start other workflows (GitHub's
  # loop-prevention rule). This happened on 2026-08-17: a commit sat on main
  # undeployed for 33.3 hours until a manual dispatch cleared it, and it was
  # the only reason DORA lead time p95 went over the 24h guardrail.
  # So: compare main against what is deployed on a schedule, and only deploy
  # when they differ.
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to veai.jp/carequest
    runs-on: ubuntu-latest
    environment: production

    # Needed to assume the role via OIDC. No long-lived keys.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # Moved from a long-lived access key to OIDC (2026-08-17). The role can
          # only be assumed from the main branch and the production environment,
          # and its permissions are limited to veai-careready-frontend/carequest/*
          # plus CloudFront invalidation for veai.jp. The bucket is shared with
          # careready (/ready/) and both sides sync with --delete, so without a
          # narrow prefix one could wipe the other's files.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # On the scheduled run, deploy only when main and production actually
      # differ. Deploying every time piles up pointless builds and CloudFront
      # invalidations. A push or a manual dispatch always deploys, with no check.
      - name: Check deployed revision
        id: drift
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "reason=event=${{ github.event_name }}" >> "$GITHUB_OUTPUT"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deployed=$(aws s3 cp "s3://${{ secrets.S3_BUCKET }}/carequest/.deployed-sha" - 2>/dev/null | tr -d '[:space:]' || true)
          echo "deployed=${deployed:-（未記録）}"
          echo "main=${GITHUB_SHA}"
          if [ "$deployed" = "$GITHUB_SHA" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "一致。デプロイは不要"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=drift" >> "$GITHUB_OUTPUT"
            echo "⚠️ ずれている。デプロイする"
          fi

      - name: Setup Node
        if: steps.drift.outputs.should_deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.drift.outputs.should_deploy == 'true'
        run: npm ci

      - name: Build static site
        if: steps.drift.outputs.should_deploy == 'true'
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_AWS_REGION: ${{ secrets.NEXT_PUBLIC_AWS_REGION }}
        run: npm run build

      # Record the deployed revision in S3; the scheduled run compares against it.
      # It lives inside out/ so --delete does not remove it.
      - name: Record deployed revision
        if: steps.drift.outputs.should_deploy == 'true'
        run: echo "${GITHUB_SHA}" > out/.deployed-sha

      - name: Sync static files to S3
        if: steps.drift.outputs.should_deploy == 'true'
        run: |
          aws s3 sync out/ "s3://${{ secrets.S3_BUCKET }}/carequest/" \
            --delete \
            --exclude "_next/*" \
            --cache-control "public,max-age=300"

      - name: Set immutable cache for build assets
        if: steps.drift.outputs.should_deploy == 'true'
        run: |
          aws s3 sync out/_next/ "s3://${{ secrets.S3_BUCKET }}/carequest/_next/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Invalidate CloudFront cache
        if: steps.drift.outputs.should_deploy == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/carequest/*"
