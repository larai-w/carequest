name: CI

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Public-boundary guard. It only ran in pre-commit, so a clone without the
      # hook installed, or a change made through the web UI, went straight
      # through (noticed 2026-09-03). The other public repos (careready,
      # gutpacer) already run it in CI too.
      - name: Check public repository boundary
        run: python3 scripts/check_public_repo.py --tracked

      # Test the guard itself. A mistyped pattern still reports OK, so check that
      # every pattern actually detects what it is meant to detect.
      - name: Test public boundary guard
        run: python3 -m unittest scripts.check_public_repo_test -v

      # Fail on high and above only. moderate is skipped on purpose: on a
      # solo project it produces alert fatigue. Only what actually ships is in
      # scope (--omit=dev); a vulnerability in a dev tool such as eslint is not
      # shipped, so it does not fail the audit.
      - name: Security audit (high+ only)
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E smoke tests (Playwright)
    runs-on: ubuntu-latest
    # Pull requests only. For a direct push to main or development the unit
    # tests are enough.
    if: github.event_name == 'pull_request'
    needs: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  infra:
    name: Infrastructure build and synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Test
        run: npm test

      - name: CDK synth
        run: npm run synth
