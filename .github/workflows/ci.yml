name: CI

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 公開境界のガード。pre-commit にしか無く、フックを設定していない
      # クローンや Web UI 経由の変更は素通りしていた（2026-09-03 に気づいた）。
      # 他の公開repo（careready / gutpacer）は既に CI でも走らせている。
      - name: Check public repository boundary
        run: python3 scripts/check_public_repo.py --tracked

      # ガード自体のテスト。パターンを書き間違えても「OK」と出てしまうため、
      # 全パターンが実際に検出することを確かめる。
      - name: Test public boundary guard
        run: python3 -m unittest scripts.check_public_repo_test -v

      # high 以上のみ fail にする。
      # moderate は個人開発で警報疲れを起こさないため意図的にスキップ。
      # 本番出荷物の脆弱性のみを対象にする(--omit=dev)。eslint 等の
      # 開発ツールの脆弱性は出荷されないため audit の fail 対象外とする。
      - name: Security audit (high+ only)
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E smoke tests (Playwright)
    runs-on: ubuntu-latest
    # PR のみで実行。main/development への直接 push では unit test で十分。
    if: github.event_name == 'pull_request'
    needs: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  infra:
    name: Infrastructure build and synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Test
        run: npm test

      - name: CDK synth
        run: npm run synth
